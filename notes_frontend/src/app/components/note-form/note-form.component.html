<div class="form-container">
  <h2>{{ isEditMode ? 'Edit Note' : 'Create Note' }}</h2>
  <form [formGroup]="noteForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" formControlName="title">
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" formControlName="content" rows="10"></textarea>
    </div>
    <button type="submit" [disabled]="!noteForm.valid">{{ isEditMode ? 'Update' : 'Create' }}</button>
  </form>
</div>
